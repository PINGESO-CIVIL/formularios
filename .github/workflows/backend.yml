name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "sonar-project.properties"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "sonar-project.properties"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Pruebas unitarias y cobertura (coverage.out)
        run: make test

      - name: Pruebas de integración
        run: make test-int

      - name: Compilar binarios
        run: make build

      - name: Docker build
        run: docker build -t ms-formularios-backend:ci .

      - name: Trivy - escanear dependencias y configuración (go.sum, Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "backend"
          scanners: "vuln,secret,misconfig"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Trivy - escanear imagen Docker (ms-formularios-backend:ci)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ms-formularios-backend:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
