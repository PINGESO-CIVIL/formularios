name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.1
  GOVULNCHECK_VERSION: v1.9.0
  OASDIFF_VERSION: v1.35.0
  DOCKLE_VERSION: v0.4.15

jobs:
  calidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && go mod verify
      - run: pnpm verify
      - run: pnpm codegen && git diff --exit-code
      - name: contrato compatible con main
        run: |
          git show origin/main:contracts/openapi.yaml > "$RUNNER_TEMP/openapi-main.yaml"
          go run github.com/oasdiff/oasdiff@"$OASDIFF_VERSION" breaking \
            "$RUNNER_TEMP/openapi-main.yaml" contracts/openapi.yaml --fail-on ERR

  seguridad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/api/go.sum
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
      - run: cd apps/api && go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0 (hadolint v2.15.1)
        with: { recursive: true, failure-threshold: error }
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  imagen:
    needs: [calidad, seguridad]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen de la API
        run: docker build --pull -f apps/api/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} -t api:ci .
      - name: Construir imagen web
        run: docker build --pull -f apps/web/Dockerfile -t web:ci .
      - name: Escanear imagen de la API con Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Escanear imagen web con Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: web:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Revisar ambas imágenes con Dockle
        run: |
          for imagen in api:ci web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "goodwithtech/dockle:$DOCKLE_VERSION" --exit-code 1 --exit-level warn "$imagen"
          done
