name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/**"
      - "sonar-project.properties"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - "sonar-project.properties"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Tipos generados al día con el contrato
        run: pnpm gen:api && git diff --exit-code packages/forms-core/src/api/schema.d.ts

      - run: pnpm check

      - name: Generar reporte de cobertura (lcov.info)
        run: |
          pnpm test:coverage
          sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info

      - run: pnpm build

      - run: pnpm --filter forms-admin exec playwright install --with-deps chromium

      - run: pnpm e2e --project=chromium

      - name: Trivy - escanear dependencias frontend (pnpm-lock.yaml)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          scanners: "vuln,secret"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
