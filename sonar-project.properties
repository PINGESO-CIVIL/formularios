# Configuración de SonarQube (DAS §7). La clave del proyecto se confirma con el
# ayudante tras el traspaso a PINGESO-CIVIL.
sonar.projectKey=ms-formularios
sonar.projectName=formularios
sonar.sourceEncoding=UTF-8

# Código propio: API en Go, microcomponentes React y servidor de la web
sonar.sources=apps/api,apps/web/src,apps/web/servidor
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,apps/api/internal/repository/**,apps/web/src/components/ui/**,apps/web/src/api/esquema.d.ts

# Pruebas
sonar.tests=apps/api,apps/web/src,apps/web/servidor
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

# Cobertura: Go (pruebas hoy, e2e en el Hito 2) y Vitest (lcov)
sonar.go.coverage.reportPaths=coverage.out,coverage-servidor.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
