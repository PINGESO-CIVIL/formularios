# Configuración de SonarQube para el monorepo ms-formularios (PT4).
# Documentado en AGENTS.md, backend/AGENTS.md y frontend/AGENTS.md.

sonar.projectKey=ms-formularios
sonar.projectName=ms-formularios
sonar.sourceEncoding=UTF-8

# Fuentes y pruebas de backend (Go) y frontend (Vue / TypeScript)
sonar.sources=backend,frontend/packages,frontend/apps
sonar.tests=backend,frontend/packages,frontend/apps
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/e2e/**

# Exclusiones: código autogenerado (sqlc, openapi-typescript, MSW), migraciones SQL y archivos de configuración/build
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/bin/**,\
  backend/db/migrations/**,\
  backend/db/queries/**,\
  **/sqlcgen/**,\
  **/sqlc/**,\
  frontend/packages/forms-core/src/api/schema.d.ts,\
  frontend/apps/forms-admin/public/mockServiceWorker.js,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.js

# Exclusiones específicas de cobertura (entrypoints solo de wiring y mocks)
sonar.coverage.exclusions=\
  backend/cmd/**,\
  **/doc.go,\
  **/mocks/**,\
  frontend/apps/forms-admin/src/main.ts

# Reportes de cobertura generados en CI
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

