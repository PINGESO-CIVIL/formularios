# Configuración de SonarQube para el monorepo ms-formularios (PT4).
# Documentado en AGENTS.md.

sonar.projectKey=ms-formularios
sonar.projectName=ms-formularios
sonar.sourceEncoding=UTF-8

# Fuentes y pruebas de backend (Go) y frontend (React / TypeScript)
sonar.sources=apps/api,apps/web/src
sonar.tests=apps/api,apps/web/src
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/e2e/**

# Exclusiones: código autogenerado (sqlc, openapi-typescript, MSW), migraciones SQL y archivos de configuración/build
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/bin/**,\
  apps/api/db/migrations/**,\
  apps/api/db/queries/**,\
  apps/api/internal/repository/**,\
  apps/web/src/components/ui/**,\
  apps/web/src/api/schema.d.ts,\
  apps/web/public/mockServiceWorker.js,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.js

# Exclusiones específicas de cobertura (entrypoints solo de wiring y mocks)
sonar.coverage.exclusions=\
  apps/api/cmd/**,\
  **/doc.go,\
  **/mocks/**,\
  apps/web/src/main.tsx

# Reportes de cobertura generados en CI
sonar.go.coverage.reportPaths=apps/api/coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
