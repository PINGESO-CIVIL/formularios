version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - noctx
    - revive
    - sloglint
    - unconvert
    - depguard
  settings:
    depguard:
      rules:
        domain-sin-infraestructura:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/DiegoRaAr/ms-formularios-pingeso/backend/internal/app
              desc: domain no depende de app
            - pkg: github.com/DiegoRaAr/ms-formularios-pingeso/backend/internal/adapters
              desc: domain no depende de adapters
            - pkg: github.com/DiegoRaAr/ms-formularios-pingeso/backend/internal/ports
              desc: domain no depende de ports
            - pkg: github.com/jackc/pgx
              desc: domain no depende de infraestructura
            - pkg: github.com/go-chi/chi
              desc: domain no depende de infraestructura
            - pkg: github.com/lestrrat-go/jwx
              desc: domain no depende de infraestructura
        app-sin-adapters:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/DiegoRaAr/ms-formularios-pingeso/backend/internal/adapters
              desc: app depende de ports, nunca de adapters
    revive:
      rules:
        # Comentarios en español; no exigimos doc en cada identificador exportado.
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    paths:
      - internal/adapters/postgres/sqlcgen

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DiegoRaAr/ms-formularios-pingeso/backend
