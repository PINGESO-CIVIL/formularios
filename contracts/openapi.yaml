components:
  schemas:
    HealthStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HealthStatus.json
          format: uri
          readOnly: true
          type: string
        checks:
          additionalProperties:
            type: string
          type: object
        status:
          enum:
            - ok
            - unavailable
          type: string
      required:
        - status
      type: object
info:
  title: ms-formularios
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Disponible
      summary: El proceso está vivo
  /metrics:
    get:
      operationId: getMetrics
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Métricas
      summary: Métricas de Prometheus
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Disponible
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Dependencia no disponible
      summary: Disponibilidad del servicio
